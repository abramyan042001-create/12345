<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Книжная полка{% endblock %} · Книжная полка</title>
  <style>
    :root { --ink:#29271f; --muted:#777469; --paper:#faf8f3; --card:#fffefa; --line:#e9e5da; --green:#42634c; --green-dark:#304a38; --orange:#d07a48; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--paper); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
    a { color:var(--green); text-decoration:none; } a:hover { color:var(--green-dark); text-decoration:underline; }
    .topbar { background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:3; }
    .nav { max-width:1080px; margin:auto; padding:14px 22px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:flex; gap:10px; align-items:center; color:var(--ink); font-weight:750; font-size:18px; letter-spacing:-.3px; }
    .brand-mark { width:34px; height:34px; border-radius:11px; display:grid; place-items:center; background:#e9efe7; font-size:19px; }
    .links { display:flex; align-items:center; gap:22px; color:var(--muted); font-size:14px; }
    .container { max-width:1080px; margin:0 auto; padding:42px 22px 70px; }
    .hero { background:#e9efe7; border:1px solid #dce6d9; border-radius:24px; padding:34px; display:flex; justify-content:space-between; gap:24px; align-items:center; margin-bottom:28px; }
    .eyebrow { color:var(--green); font-size:12px; font-weight:750; text-transform:uppercase; letter-spacing:1.2px; }
    h1 { font-size:clamp(28px,5vw,42px); line-height:1.12; letter-spacing:-1.2px; margin:9px 0 10px; }
    h2 { font-size:24px; letter-spacing:-.5px; margin:0 0 8px; } p { margin:0 0 12px; }
    .muted { color:var(--muted); } .hero p { max-width:560px; color:#62665c; }
    .button { display:inline-flex; justify-content:center; align-items:center; gap:8px; border:0; border-radius:12px; background:var(--green); color:white; padding:12px 17px; font:inherit; font-weight:650; cursor:pointer; white-space:nowrap; }
    .button:hover { background:var(--green-dark); color:white; text-decoration:none; } .button-light { color:var(--green); background:#edf1e9; } .button-light:hover { background:#dce7d8; color:var(--green-dark); }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:28px; }
    .stat,.panel,.book-card,.person-card { background:var(--card); border:1px solid var(--line); border-radius:17px; }
    .stat { padding:16px 19px; } .stat b { display:block; font-size:24px; } .stat span { font-size:13px; color:var(--muted); }
    .section-head { display:flex; justify-content:space-between; gap:20px; align-items:center; margin:28px 0 16px; }
    .search { display:flex; gap:8px; } input,select,textarea { width:100%; padding:12px 13px; border:1px solid #dcd8cd; border-radius:11px; background:white; color:var(--ink); font:inherit; }
    .search input { width:min(300px,50vw); } input:focus,select:focus,textarea:focus { outline:3px solid #dce8d9; border-color:#8da78e; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; }
    .book-card { padding:19px; display:flex; flex-direction:column; min-height:206px; transition:transform .15s,box-shadow .15s; }
    .book-card:hover { transform:translateY(-2px); box-shadow:0 9px 25px #2b30150d; }
    .book-icon { width:38px;height:38px;border-radius:12px;background:#f7eee5;display:grid;place-items:center;margin-bottom:15px;font-size:19px; }
    .book-title { font-weight:720; font-size:18px; line-height:1.3; margin-bottom:8px; color:var(--ink); }
    .book-meta { color:var(--muted); font-size:14px; } .book-year { margin-top:auto; padding-top:15px; font-size:12px; color:#918d80; }
    .panel { padding:26px; } .form-row { margin-bottom:18px; } .form-row label { display:block; font-size:14px; font-weight:650; margin-bottom:7px; }
    .helptext { color:var(--muted); font-size:12px; } .errorlist { color:#a23f36; padding-left:20px; font-size:13px; }
    .messages { list-style:none; margin:0 0 18px; padding:0; } .messages li { background:#e9efe7; color:var(--green-dark); padding:12px 15px; border-radius:11px; }
    .detail-layout { display:grid; grid-template-columns:1fr 270px; gap:20px; align-items:start; } .detail-main { padding:30px; } .detail-side { padding:22px; }
    .detail-title { font-size:clamp(30px,5vw,46px); margin:8px 0 20px; } .detail-row { padding:13px 0; border-top:1px solid var(--line); }
    .detail-row span { display:block; color:var(--muted); font-size:12px; margin-bottom:3px; }
    .actions { display:flex; flex-wrap:wrap; gap:9px; margin-top:22px; } .text-button { background:none; border:0; color:#9b453b; cursor:pointer; font:inherit; padding:10px; }
    .person-card { padding:19px; } .person-card h3 { margin:0 0 8px; } .person-card p { font-size:14px; color:var(--muted); }
    .empty { padding:42px 20px; text-align:center; border:1px dashed #d6d1c4; border-radius:17px; color:var(--muted); grid-column:1/-1; }
    .pagination { display:flex; justify-content:center; align-items:center; gap:12px; margin-top:25px; color:var(--muted); }
    footer { border-top:1px solid var(--line); color:var(--muted); text-align:center; padding:22px; font-size:13px; }
    @media(max-width:760px) { .grid{grid-template-columns:repeat(2,1fr)} .detail-layout{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.section-head{align-items:flex-start;flex-direction:column}.search{width:100%}.search input{width:100%} }
    @media(max-width:520px) { .nav{align-items:flex-start;flex-direction:column;gap:9px}.links{gap:14px}.container{padding:25px 15px 48px}.hero{padding:25px 21px}.stats{gap:8px}.stat{padding:13px 12px}.stat b{font-size:20px}.grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
<header class="topbar"><nav class="nav">
  <a class="brand" href="{% url 'book-list' %}"><span class="brand-mark">▤</span>Книжная полка</a>
  <div class="links"><a href="{% url 'book-list' %}">Книги</a><a href="{% url 'author-list' %}">Авторы</a><a href="{% url 'publisher-list' %}">Издательства</a></div>
</nav></header>
<main class="container">
  {% if messages %}<ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>{% endif %}
  {% block content %}{% endblock %}
</main>
<footer>Учебный проект на Django · Представления на основе классов</footer>
</body>
</html>
